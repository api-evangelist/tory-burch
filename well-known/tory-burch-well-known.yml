api_gateway_observed:
  vendor: Apigee (Google Cloud Apigee Edge)
  path: https://www.toryburch.com/api/
  evidence: >-
    every path under /api/ returns HTTP 404 with content-type application/json and an Apigee
    routing fault body, e.g. GET /api/graphql ->
    {"fault":{"faultstring":"Unable to identify proxy for host: secure and url: /graphql",
    "detail":{"errorcode":"messaging.adaptors.http.flow.ApplicationNotFound"}}}
  virtual_host: secure
  interpretation: >-
    Tory Burch does run a real API gateway, but it is a private first-party storefront
    gateway. The ApplicationNotFound fault means no proxy is registered at any of the
    probed paths (/api/, /api/v1, /api/graphql, /api/openapi.json, /api/prod-r2). No proxy
    catalog, no reference and no specification is published for it, and no credentials are
    obtainable by the public. It is recorded here as an observed platform fact only - it is
    NOT registered as an API in apis.yml, because no callable public contract exists.
contract_discovery:
  openapi: >-
    not found. Probed /openapi.json, /openapi.yaml, /swagger.json, /api-docs, /docs and
    /redoc on the storefront apex, on the /en-us locale root and on the Apigee /api/ path
    prefix. Every candidate returned a 301 locale redirect terminating in an HTML 404, or an
    Apigee ApplicationNotFound JSON fault. No response parsed as OpenAPI or Swagger.
  graphql: >-
    not found. /graphql, /graphql/ and /en-us/graphql return HTML 404s from Next.js;
    /api/graphql returns the Apigee ApplicationNotFound fault. There is no GraphQL surface
    to introspect, so no introspection query was issued and no SDL is recorded.
  mcp: >-
    not found. No mcp.toryburch.com host resolves, no hosted or remote MCP server is
    advertised anywhere on the site or in the llms.txt, and no tools/list endpoint exists to
    call.
  asyncapi: >-
    not found. No event, streaming or webhook surface is documented anywhere on the public
    site.
  a2a_agent_card: >-
    not found. Both /.well-known/agent-card.json and the legacy /.well-known/agent.json
    return 404 on www.toryburch.com and on the foundation host. Per the pipeline contract an
    agent card is search-only and is never authored on a provider's behalf, so no a2a/
    directory is created and no AgentCard pointer is wired.
  conclusion: >-
    Tory Burch publishes exactly one machine-readable artifact - a retail-content llms.txt -
    and no API contract of any kind. This is a completed negative result on the contract
    hunt, not an unfinished probe.
