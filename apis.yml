aid: tory-burch
name: Tory Burch
description: 'Tory Burch LLC is an American luxury women''s fashion label founded in
  February 2004 by designer Tory Burch and headquartered in New York City, trading under
  the legal entity River Light V, L.P. The privately held company designs and sells
  ready-to-wear clothing, designer shoes, handbags, small leather goods, jewellery, watches,
  eyewear, fragrance and beauty, swimwear and home decor, together with the Tory Sport
  activewear line, through roughly 400 boutiques worldwide, wholesale partners and a
  direct-to-consumer storefront at toryburch.com serving the United States, United Kingdom,
  the European Union and Asia. Its affiliated Tory Burch Foundation funds and educates
  women entrepreneurs. Tory Burch is a fashion and retail business rather than a software
  vendor: it operates no developer program, publishes no API documentation, SDKs or
  machine-readable API contract, and holds no public GitHub organisation. Its storefront
  is a Next.js front end on Akamai over a Salesforce Commerce Cloud (Demandware) commerce
  platform with Adobe Scene7 media, and an Apigee API gateway fronts www.toryburch.com/api/
  for first-party storefront traffic only, exposing no publicly registered proxy. The
  one machine-readable artifact the company does publish is a site-wide llms.txt.'
